<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hululugame 管理後台</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: #f6f6f6;
      color: #222;
    }

    .header {
      background: #222;
      color: white;
      padding: 18px;
      text-align: center;
      font-weight: bold;
      font-size: 22px;
    }

    .container {
      max-width: 520px;
      margin: auto;
      padding: 18px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
      margin-bottom: 16px;
    }

    h2 {
      margin-top: 0;
    }

    .input {
      width: 100%;
      height: 48px;
      border: 2px solid #ddd;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    .button {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 12px;
      background: #e63946;
      color: white;
      font-size: 16px;
      font-weight: bold;
      margin-top: 4px;
    }

    .button.secondary {
      background: #444;
    }

    .hidden {
      display: none;
    }

    .status {
      text-align: center;
      margin-top: 12px;
      font-weight: bold;
    }

    .menu-button {
      width: 100%;
      text-align: left;
      padding: 16px;
      border: none;
      background: #f3f3f3;
      border-radius: 12px;
      margin-bottom: 10px;
      font-size: 16px;
      font-weight: bold;
    }

    .small {
      color: #777;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="header">
    🔐 hululugame 管理後台
  </div>

  <main class="container">

    <section id="loginCard" class="card">
      <h2>管理員登入</h2>

      <input
        id="email"
        class="input"
        type="email"
        placeholder="管理員 Email"
      >

      <input
        id="password"
        class="input"
        type="password"
        placeholder="密碼"
      >

      <button class="button" onclick="login()">
        登入後台
      </button>

      <div id="loginStatus" class="status"></div>

      <p class="small">
        此頁僅供管理員使用。
      </p>
    </section>


    <section id="adminPanel" class="card hidden">

      <h2>管理功能</h2>

      <div id="adminEmail" class="small" style="margin-bottom:16px;"></div>

      <button class="menu-button" onclick="openCampaignManager()">
  🎪 管理每期抽抽樂
</button>

      <button class="menu-button" onclick="comingSoon()">
        🎁 管理獎品
      </button>

      <button class="menu-button" onclick="comingSoon()">
        🎟️ 建立客人抽獎碼
      </button>

      <button class="menu-button" onclick="openMemberDrawManager()">
  ➕ 幫客人增加抽數
</button>

      <button class="menu-button" onclick="comingSoon()">
        🏆 查看中獎紀錄
      </button>

      <button class="menu-button" onclick="comingSoon()">
        ✅ 標記已領獎
      </button>

      <button class="button secondary" onclick="logout()">
        登出
      </button>
<div id="campaignManager" class="hidden" style="margin-top:20px;">

  <hr style="border:none;border-top:1px solid #ddd;margin:20px 0;">

  <h2>🎪 管理每期抽抽樂</h2>

  <input
    id="campaignTitle"
    class="input"
    placeholder="例如：2026年9月抽抽樂"
  >

  <input
    id="campaignSlots"
    class="input"
    type="number"
    inputmode="numeric"
    placeholder="總格數，例如：300"
  >

  <input
    id="campaignSpend"
    class="input"
    type="number"
    inputmode="numeric"
    placeholder="消費多少送1抽，例如：1000"
  >

  <button class="button" onclick="createCampaign()">
    ＋ 建立新一期
  </button>

  <div id="campaignStatus" class="status"></div>

  <h3 style="margin-top:25px;">已建立活動</h3>

  <div id="campaignList">
    載入中...
  </div>

</div>

<div id="memberDrawManager" class="hidden" style="margin-top:20px;">

  <hr style="border:none;border-top:1px solid #ddd;margin:20px 0;">

  <h2>➕ 幫會員增加抽數</h2>

<input
  id="memberSearch"
  class="input"
  placeholder="搜尋暱稱或 Email"
  oninput="filterMembers()"
>

<div id="memberList">
  載入會員中...
</div>

</div>

    </section>

  </main>


  <script>

    const SUPABASE_URL =
      'https://rhssnydqgdlkaxwrwwlp.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_KN1SvNhpJtxfTg-Lz_D16w_6L41j_wW';

    const db = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    async function login() {

      const email =
        document.getElementById('email').value.trim();

      const password =
        document.getElementById('password').value;

      const status =
        document.getElementById('loginStatus');

      if (!email || !password) {
        status.innerText = '請輸入 Email 和密碼';
        return;
      }

      status.innerText = '登入中...';

      const { data, error } =
        await db.auth.signInWithPassword({
          email,
          password
        });

      if (error) {
        console.error(error);
        status.innerText = '登入失敗，請確認帳號密碼';
        return;
      }

      status.innerText = '';

      showAdmin(data.user);

    }


    async function logout() {

      await db.auth.signOut();

      document.getElementById('adminPanel')
        .classList.add('hidden');

      document.getElementById('loginCard')
        .classList.remove('hidden');

      document.getElementById('password').value = '';

    }


    function showAdmin(user) {

      document.getElementById('loginCard')
        .classList.add('hidden');

      document.getElementById('adminPanel')
        .classList.remove('hidden');

      document.getElementById('adminEmail')
        .innerText =
          '目前登入：' + (user?.email || '管理員');

    }

async function openCampaignManager() {

  const box =
    document.getElementById('campaignManager');

  box.classList.toggle('hidden');

  if (!box.classList.contains('hidden')) {
    await loadCampaigns();
  }

}


async function loadCampaigns() {

  const list =
    document.getElementById('campaignList');

  list.innerHTML = '載入中...';

  const { data, error } =
    await db.rpc('admin_get_campaigns');

  if (error) {

    console.error(error);

    list.innerHTML =
      '讀取失敗：' + error.message;

    return;

  }

  if (!data || data.length === 0) {

    list.innerHTML =
      '<div class="small">目前沒有活動</div>';

    return;

  }

  list.innerHTML = '';

  data.forEach(item => {

    const box =
      document.createElement('div');

    box.style.background = '#f3f3f3';
    box.style.borderRadius = '12px';
    box.style.padding = '14px';
    box.style.marginBottom = '10px';

    box.innerHTML = `
      <div style="font-weight:bold;font-size:17px;">
        ${escapeHtmlAdmin(item.title)}
      </div>

      <div class="small" style="margin-top:6px;">
        格數：${item.total_slots}<br>
        消費 ${item.spend_per_draw} 元送 1 抽<br>
        狀態：${escapeHtmlAdmin(item.status)}
      </div>
    `;

    list.appendChild(box);

  });

}


async function createCampaign() {

  const title =
    document.getElementById('campaignTitle')
      .value.trim();

  const slots =
    Number(
      document.getElementById('campaignSlots')
        .value
    );

  const spend =
    Number(
      document.getElementById('campaignSpend')
        .value
    );

  const status =
    document.getElementById('campaignStatus');


  if (!title) {

    status.innerText =
      '請輸入活動名稱';

    return;

  }


  if (!Number.isInteger(slots) || slots <= 0) {

    status.innerText =
      '格數要填大於0的整數';

    return;

  }


  if (!Number.isInteger(spend) || spend < 0) {

    status.innerText =
      '消費金額格式不正確';

    return;

  }


  status.innerText =
    '建立中...';


  const { data, error } =
    await db.rpc(
      'admin_create_campaign',
      {
        p_title: title,
        p_total_slots: slots,
        p_spend_per_draw: spend
      }
    );


  if (error) {

    console.error(error);

    status.innerText =
      '建立失敗：' + error.message;

    return;

  }


  status.innerText =
    '✅ 建立成功';


  document.getElementById(
    'campaignTitle'
  ).value = '';

  document.getElementById(
    'campaignSlots'
  ).value = '';

  document.getElementById(
    'campaignSpend'
  ).value = '';


  await loadCampaigns();

}


function escapeHtmlAdmin(text) {

  const div =
    document.createElement('div');

  div.textContent =
    text ?? '';

  return div.innerHTML;

}
async function openMemberDrawManager() {

  const box =
    document.getElementById('memberDrawManager');

  box.classList.toggle('hidden');

  if (!box.classList.contains('hidden')) {
    await loadMembers();
  }

}


async function loadMembers() {

  const list =
    document.getElementById('memberList');

  list.innerHTML =
    '載入會員中...';


  const { data, error } =
    await db.rpc('admin_get_members');


  if (error) {

    console.error(error);

    list.innerHTML =
      '讀取會員失敗：' + error.message;

    return;

  }


  allMembers =
    data || [];


  renderMembers(allMembers);

}


function renderMembers(members) {

  const list =
    document.getElementById('memberList');


  if (!members || members.length === 0) {

    list.innerHTML =
      '<div class="small">找不到符合的會員</div>';

    return;

  }


  list.innerHTML = '';


  members.forEach(member => {

    const box =
      document.createElement('div');

    box.style.background = '#f3f3f3';
    box.style.borderRadius = '12px';
    box.style.padding = '14px';
    box.style.marginBottom = '12px';


    const name =
      member.display_name ||
      '未設定暱稱';


    box.innerHTML = `

      <div style="font-weight:bold;font-size:17px;">
        👤 ${escapeHtmlAdmin(name)}
      </div>

      <div class="small" style="margin:6px 0 12px;">
        ${escapeHtmlAdmin(member.email)}
      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;">

        <button
          class="button"
          style="width:auto;padding:0 16px;"
          onclick="addMemberDraws('${member.user_id}', 1)"
        >
          +1 抽
        </button>

        <button
          class="button"
          style="width:auto;padding:0 16px;"
          onclick="addMemberDraws('${member.user_id}', 3)"
        >
          +3 抽
        </button>

        <button
          class="button"
          style="width:auto;padding:0 16px;"
          onclick="addMemberDraws('${member.user_id}', 5)"
        >
          +5 抽
        </button>

      </div>

      <div style="margin-top:10px;display:flex;gap:8px;">

        <input
          id="custom-${member.user_id}"
          class="input"
          type="number"
          inputmode="numeric"
          placeholder="自訂抽數"
          style="margin-bottom:0;"
        >

        <button
          class="button secondary"
          style="width:auto;padding:0 16px;"
          onclick="addCustomMemberDraws('${member.user_id}')"
        >
          加入
        </button>

      </div>

      <div
        id="member-status-${member.user_id}"
        class="small"
        style="margin-top:8px;"
      ></div>

    `;


    list.appendChild(box);

  });

}

async function addMemberDraws(
  userId,
  draws
) {

  const status =
    document.getElementById(
      'member-status-' + userId
    );


  status.innerText =
    '處理中...';


  const { error } =
    await db.rpc(
      'admin_add_member_draws',
      {
        p_user_id: userId,
        p_draws: draws
      }
    );


  if (error) {

    console.error(error);

    status.innerText =
      '增加失敗：' + error.message;

    return;

  }


  status.innerText =
    `✅ 已增加 ${draws} 抽`;

}


async function addCustomMemberDraws(
  userId
) {

  const input =
    document.getElementById(
      'custom-' + userId
    );


  const draws =
    Number(input.value);


  if (!Number.isInteger(draws) || draws <= 0) {

    alert('請輸入大於 0 的整數');

    return;

  }


  await addMemberDraws(
    userId,
    draws
  );


  input.value = '';

}

let allMembers = [];


function filterMembers() {

  const keyword =
    document.getElementById('memberSearch')
      .value.trim()
      .toLowerCase();

  if (!keyword) {
    renderMembers(allMembers);
    return;
  }

  const filtered =
    allMembers.filter(member => {

      const name =
        (member.display_name || '')
          .toLowerCase();

      const email =
        (member.email || '')
          .toLowerCase();

      return (
        name.includes(keyword) ||
        email.includes(keyword)
      );

    });

  renderMembers(filtered);

}

    function comingSoon() {

      alert('這個功能下一步開始做');

    }


    async function checkSession() {

      const { data } =
        await db.auth.getSession();

      if (data.session) {
        showAdmin(data.session.user);
      }

    }


    checkSession();

  </script>

</body>
</html>
