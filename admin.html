<!DOCTYPE html>
<html lang="zh-Hant">
<head>

  <title>hululugame 管理後台</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: #f6f6f6;
      color: #222;
    }

    .header {
      background: #222;
      color: white;
      padding: 18px;
      text-align: center;
      font-weight: bold;
      font-size: 22px;

    .container {
      max-width: 520px;

    }

    .card {
      background: white;

      margin-bottom: 16px;

      width: 100%;
      height: 48px;
      border: 2px solid #ddd;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 16px;
      margin-bottom: 12px;

    .button {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 12px;
      background: #e63946;
      color: white;
      font-size: 16px;
      font-weight: bold;
      margin-top: 4px;

    .button.secondary {

    }

    .hidden {
      display: none;
    }

    .status {
      text-align: center;
      margin-top: 12px;
      font-weight: bold;
    }

    .menu-button {
      width: 100%;
      text-align: left;
      padding: 16px;
      border: none;
      background: #f3f3f3;
      border-radius: 12px;
      margin-bottom: 10px;
      font-size: 16px;
      font-weight: bold;
    }

    .small {
      color: #777;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>

<div id="memberDrawManager" class="hidden" style="margin-top:20px;">

<input

>

<div id="drawResultsManager" class="hidden" style="margin-top:20px;">

  <script>

      const status =
        document.getElementById('loginStatus');

        return;
      }

      status.innerText = '登入中...';

        await db.auth.signInWithPassword({

          password
        });

        console.error(error);
        status.innerText = '登入失敗，請確認帳號密碼';
        return;
      }

      const { error: adminError } =
  await db.rpc('admin_get_campaigns');

if (adminError) {

  await db.auth.signOut();

  status.innerText =
    '❌ 這個帳號沒有管理員權限';

  return;

}

status.innerText = '';

showAdmin(data.user);

    async function logout() {

      await db.auth.signOut();

      document.getElementById('adminPanel')
        .classList.add('hidden');

      document.getElementById('loginCard')
        .classList.remove('hidden');

      document.getElementById('password').value = '';

      document.getElementById('loginCard')
        .classList.add('hidden');

        .classList.remove('hidden');

async function openCampaignManager() {

  const campaignBox =
    document.getElementById('campaignManager');

  const memberBox =
    document.getElementById('memberDrawManager');

  // 關閉會員加抽區
  memberBox.classList.add('hidden');
  
    // 關閉兌換碼管理區
  document.getElementById('redemptionManager')
  .classList.add('hidden');
  
  // 關閉中獎紀錄區
document.getElementById('drawResultsManager')
  .classList.add('hidden');

  campaignBox.classList.toggle('hidden');

  if (!campaignBox.classList.contains('hidden')) {
    await loadCampaigns();
  }

}

async function openPrizeManager() {

  document.getElementById('campaignManager')
    .classList.add('hidden');

  document.getElementById('memberDrawManager')
    .classList.add('hidden');

  document.getElementById('redemptionManager')
    .classList.add('hidden');

  document.getElementById('drawResultsManager')
    .classList.add('hidden');

  const prizeBox =
    document.getElementById('prizeManager');

  prizeBox.classList.toggle('hidden');

  if (!prizeBox.classList.contains('hidden')) {
    await loadPrizeCampaigns();
  }

}

async function loadPrizeCampaigns() {

  const select =
    document.getElementById('prizeCampaignSelect');

  select.innerHTML =
    '<option value="">請選擇活動</option>';

  const { data, error } =
    await db.rpc('admin_get_campaigns');

  if (error) {
    console.error(error);
    return;
  }

  (data || []).forEach(item => {

    const option =
      document.createElement('option');

    option.value = item.id;

    option.textContent =
      `${item.title}（${item.status}）`;

    select.appendChild(option);

  });

  select.onchange = async function() {

    const campaignId = this.value;

    if (!campaignId) {

      document.getElementById('prizeList')
        .innerHTML = '請先選擇活動';

      return;
    }

    await loadCampaignPrizes(campaignId);

  };

}

async function loadCampaignPrizes(campaignId) {

  const list =
    document.getElementById('prizeList');

  list.innerHTML = '載入獎品中...';

  const { data, error } =
    await db.rpc(
      'admin_get_campaign_prizes',
      {
        p_campaign_id: campaignId
      }
    );

  if (error) {

    console.error(error);

    list.innerHTML =
      '讀取獎品失敗：' + error.message;

    return;

  }

  if (!data || data.length === 0) {

    list.innerHTML =
      '<div class="small">這一期還沒有設定獎品</div>';

    return;

  }

  list.innerHTML = '';

  data.forEach(item => {

    const box =
      document.createElement('div');

    box.style.background = '#f3f3f3';
    box.style.borderRadius = '12px';
    box.style.padding = '12px';
    box.style.marginBottom = '10px';

    box.innerHTML = `
      <div style="font-weight:bold;">
        🎁 ${escapeHtmlAdmin(item.name)}
      </div>

      <div class="small" style="margin-top:6px;">
        數量：${item.quantity}<br>
        ${item.requires_redemption
          ? '✅ 需要領取 / 兌領'
          : 'ℹ️ 無需領取'}
      </div>
    `;

    list.appendChild(box);

  });

}

async function addPrize() {

  const campaignId =
    document.getElementById('prizeCampaignSelect')
      .value;

  const name =
    document.getElementById('prizeName')
      .value.trim();

  const quantity =
    Number(
      document.getElementById('prizeQuantity')
        .value
    );

  const requiresRedemption =
    document.getElementById('prizeRequiresRedemption')
      .checked;

  const status =
    document.getElementById('prizeStatus');


  if (!campaignId) {

    status.innerText =
      '請先選擇活動';

    return;

  }


  if (!name) {

    status.innerText =
      '請輸入獎品名稱';

    return;

  }


  if (!Number.isInteger(quantity) || quantity <= 0) {

    status.innerText =
      '獎品數量必須是大於 0 的整數';

    return;

  }


  status.innerText =
    '新增中...';


  const { error } =
    await db.rpc(
      'admin_add_prize',
      {
        p_campaign_id: campaignId,
        p_name: name,
        p_quantity: quantity,
        p_requires_redemption: requiresRedemption
      }
    );


  if (error) {

    console.error(error);

    status.innerText =
      '新增失敗：' + error.message;

    return;

  }


  status.innerText =
    '✅ 新增成功';


  document.getElementById('prizeName')
    .value = '';

  document.getElementById('prizeQuantity')
    .value = '';

  document.getElementById('prizeRequiresRedemption')
    .checked = true;


  await loadCampaignPrizes(campaignId);

}

async function loadCampaigns() {

  const list =
    document.getElementById('campaignList');

  list.innerHTML = '載入中...';

  const { data, error } =
    await db.rpc('admin_get_campaigns');

  if (error) {

    console.error(error);

    list.innerHTML =
      '讀取失敗：' + error.message;

    return;

  }

  if (!data || data.length === 0) {

    list.innerHTML =
      '<div class="small">目前沒有活動</div>';

    return;

  }

  list.innerHTML = '';

  data.forEach(item => {

    const box =
      document.createElement('div');

    box.style.background = '#f3f3f3';
    box.style.borderRadius = '12px';
    box.style.padding = '14px';
    box.style.marginBottom = '10px';

    const publishButton = item.status === 'active'
  ? `
      <div style="margin-top:10px;font-weight:bold;">
        ✅ 目前正式活動
      </div>
    `
  : `
      <button
        class="button"
        style="margin-top:10px;"
        onclick="publishCampaign('${item.id}')"
      >
        🚀 發布活動
      </button>
    `;

box.innerHTML = `
  <div style="font-weight:bold;font-size:17px;">
    ${escapeHtmlAdmin(item.title)}
  </div>

  <div class="small" style="margin-top:6px;">
    格數：${item.total_slots}<br>
    消費 ${item.spend_per_draw} 元送 1 抽<br>
    狀態：${escapeHtmlAdmin(item.status)}
  </div>

  ${publishButton}
`;

    list.appendChild(box);

  });

}


async function createCampaign() {

  const title =
    document.getElementById('campaignTitle')
      .value.trim();

  const slots =
    Number(
      document.getElementById('campaignSlots')
        .value
    );

  const spend =
    Number(
      document.getElementById('campaignSpend')
        .value
    );

  const status =
    document.getElementById('campaignStatus');


  if (!title) {

    status.innerText =
      '請輸入活動名稱';

    return;

  }


  if (!Number.isInteger(slots) || slots <= 0) {

    status.innerText =
      '格數要填大於0的整數';

    return;

  }


  if (!Number.isInteger(spend) || spend < 0) {

    status.innerText =
      '消費金額格式不正確';

    return;

  }


  status.innerText =
    '建立中...';


  const { data, error } =
    await db.rpc(
      'admin_create_campaign',
      {
        p_title: title,
        p_total_slots: slots,
        p_spend_per_draw: spend
      }
    );


  if (error) {

    console.error(error);

    status.innerText =
      '建立失敗：' + error.message;

    return;

  }


  status.innerText =
    '✅ 建立成功';


  document.getElementById(
    'campaignTitle'
  ).value = '';

  document.getElementById(
    'campaignSlots'
  ).value = '';

  document.getElementById(
    'campaignSpend'
  ).value = '';


  await loadCampaigns();

}

async function publishCampaign(campaignId) {

  const ok = confirm(
    '確定要發布這一期活動嗎？\n\n目前其他 active 活動會自動變成 ended。'
  );

  if (!ok) return;


  const { error } =
    await db.rpc(
      'admin_publish_campaign',
      {
        p_campaign_id: campaignId
      }
    );


  if (error) {

    console.error(error);

    alert(
      '發布失敗：' + error.message
    );

    return;

  }


  alert('✅ 活動已正式發布');

  await loadCampaigns();

}


function escapeHtmlAdmin(text) {

  const div =
    document.createElement('div');

  div.textContent =
    text ?? '';

  return div.innerHTML;

}
async function openMemberDrawManager() {

  const memberBox =
    document.getElementById('memberDrawManager');

  const campaignBox =
    document.getElementById('campaignManager');

  // 關閉活動管理區
  campaignBox.classList.add('hidden');

// 關閉兌換碼管理區
document.getElementById('redemptionManager')
  .classList.add('hidden');
  
  // 關閉中獎紀錄區
document.getElementById('drawResultsManager')
  .classList.add('hidden');
  
  memberBox.classList.toggle('hidden');

  if (!memberBox.classList.contains('hidden')) {
    await loadMembers();
  }

}


async function loadMembers() {

  const list =
    document.getElementById('memberList');

  list.innerHTML =
    '載入會員中...';


  const { data, error } =
    await db.rpc('admin_get_members');


  if (error) {

    console.error(error);

    list.innerHTML =
      '讀取會員失敗：' + error.message;

    return;

  }


  allMembers =
    data || [];


  renderMembers(allMembers);

}


function renderMembers(members) {

  const list =
    document.getElementById('memberList');


  if (!members || members.length === 0) {

    list.innerHTML =
      '<div class="small">找不到符合的會員</div>';

    return;

  }


  list.innerHTML = '';


  members.forEach(member => {

    const box =
      document.createElement('div');

    box.style.background = '#f3f3f3';
    box.style.borderRadius = '12px';
    box.style.padding = '14px';
    box.style.marginBottom = '12px';


    const name =
      member.display_name ||
      '未設定暱稱';


    box.innerHTML = `

      <div style="font-weight:bold;font-size:17px;">
        👤 ${escapeHtmlAdmin(name)}
      </div>

      <div class="small" style="margin:6px 0 12px;">
        ${escapeHtmlAdmin(member.email)}
      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;">

        <button
          class="button"
          style="width:auto;padding:0 16px;"
          onclick="addMemberDraws('${member.user_id}', 1)"
        >
          +1 抽
        </button>

        <button
          class="button"
          style="width:auto;padding:0 16px;"
          onclick="addMemberDraws('${member.user_id}', 3)"
        >
          +3 抽
        </button>

        <button
          class="button"
          style="width:auto;padding:0 16px;"
          onclick="addMemberDraws('${member.user_id}', 5)"
        >
          +5 抽
        </button>

      </div>

      <div style="margin-top:10px;display:flex;gap:8px;">

        <input
          id="custom-${member.user_id}"
          class="input"
          type="number"
          inputmode="numeric"
          placeholder="自訂抽數"
          style="margin-bottom:0;"
        >

        <button
          class="button secondary"
          style="width:auto;padding:0 16px;"
          onclick="addCustomMemberDraws('${member.user_id}')"
        >
          加入
        </button>

      </div>

      <div
        id="member-status-${member.user_id}"
        class="small"
        style="margin-top:8px;"
      ></div>

    `;


    list.appendChild(box);

  });

}

async function addMemberDraws(
  userId,
  draws
) {

  const status =
    document.getElementById(
      'member-status-' + userId
    );


  status.innerText =
    '處理中...';


  const { error } =
    await db.rpc(
      'admin_add_member_draws',
      {
        p_user_id: userId,
        p_draws: draws
      }
    );


  if (error) {

    console.error(error);

    status.innerText =
      '增加失敗：' + error.message;

    return;

  }


  status.innerText =
    `✅ 已增加 ${draws} 抽`;

}


async function addCustomMemberDraws(
  userId
) {

  const input =
    document.getElementById(
      'custom-' + userId
    );


  const draws =
    Number(input.value);


  if (!Number.isInteger(draws) || draws <= 0) {

    alert('請輸入大於 0 的整數');

    return;

  }


  await addMemberDraws(
    userId,
    draws
  );


  input.value = '';

}

let allMembers = [];


function filterMembers() {

  const keyword =
    document.getElementById('memberSearch')
      .value.trim()
      .toLowerCase();

  if (!keyword) {
    renderMembers(allMembers);
    return;
  }

  const filtered =
    allMembers.filter(member => {

      const name =
        (member.display_name || '')
          .toLowerCase();

      const email =
        (member.email || '')
          .toLowerCase();

      return (
        name.includes(keyword) ||
        email.includes(keyword)
      );

    });

  renderMembers(filtered);

}

async function loadRedemptionCodes() {

  const list =
    document.getElementById('redeemList');

  list.innerHTML = '載入中...';


  const { data, error } =
    await db.rpc('admin_get_redemption_codes');


  if (error) {

    console.error(error);

    list.innerHTML =
      '讀取失敗：' + error.message;

    return;

  }


  if (!data || data.length === 0) {

    list.innerHTML =
      '<div class="small">目前沒有兌換碼</div>';

    return;

  }


  list.innerHTML = '';


  data.forEach(item => {

    const box =
      document.createElement('div');

    box.style.background = '#f3f3f3';
    box.style.borderRadius = '12px';
    box.style.padding = '14px';
    box.style.marginBottom = '12px';


    const maxText =
      item.max_redemptions == null
        ? '不限'
        : item.max_redemptions;


    const endText =
      item.ends_at
        ? new Date(item.ends_at).toLocaleString()
        : '無期限';


    box.innerHTML = `
      <div style="font-weight:bold;font-size:18px;">
        🎟️ ${escapeHtmlAdmin(item.code)}
      </div>

      <div class="small" style="margin-top:6px;">
        ${escapeHtmlAdmin(item.title || '')}<br>
        可兌換：${item.draws} 抽<br>
        已兌換：${item.current_redemptions} / ${maxText}<br>
        到期：${escapeHtmlAdmin(endText)}<br>
        狀態：${item.is_active ? '啟用中' : '已停用'}
      </div>
    `;

    list.appendChild(box);

  });

}


async function createRedemptionCode() {

  const code =
    document.getElementById('redeemCode')
      .value.trim();

  const title =
    document.getElementById('redeemTitle')
      .value.trim();

  const draws =
    Number(
      document.getElementById('redeemDraws').value
    );

  const maxRaw =
    document.getElementById('redeemMax').value.trim();

  const max =
    maxRaw === ''
      ? null
      : Number(maxRaw);

  const endRaw =
    document.getElementById('redeemEnd').value;

  const endsAt =
    endRaw
      ? new Date(endRaw).toISOString()
      : null;

  const status =
    document.getElementById('redeemStatus');


  if (!code) {

    status.innerText =
      '請輸入兌換碼';

    return;

  }


  if (!Number.isInteger(draws) || draws <= 0) {

    status.innerText =
      '兌換抽數要填大於 0 的整數';

    return;

  }


  if (
    max !== null &&
    (!Number.isInteger(max) || max <= 0)
  ) {

    status.innerText =
      '兌換上限格式不正確';

    return;

  }


  status.innerText =
    '建立中...';


  const { error } =
    await db.rpc(
      'admin_create_redemption_code',
      {
        p_code: code,
        p_title: title,
        p_draws: draws,
        p_max_redemptions: max,
        p_ends_at: endsAt
      }
    );


  if (error) {

    console.error(error);

    status.innerText =
      '建立失敗：' + error.message;

    return;

  }


  status.innerText =
    '✅ 兌換碼建立成功';


  document.getElementById('redeemCode').value = '';
  document.getElementById('redeemTitle').value = '';
  document.getElementById('redeemDraws').value = '';
  document.getElementById('redeemMax').value = '';
  document.getElementById('redeemEnd').value = '';


  await loadRedemptionCodes();

}

    let allDrawResults = [];

  document.getElementById('campaignManager')
    .classList.add('hidden');

    .classList.add('hidden');

  document.getElementById('redemptionManager')

async function loadDrawResults() {

  const list =
    document.getElementById('drawResultList');

  list.innerHTML =
    '載入中...';


  const { data, error } =
    await db.rpc('admin_get_draw_results');


  if (error) {

    console.error(error);

    list.innerHTML =
      '讀取失敗：' + error.message;

    return;

  }


  allDrawResults =
    data || [];


  renderDrawResults(allDrawResults);

}


function filterDrawResults() {

  const keyword =
    document.getElementById('drawResultSearch')
      .value.trim()
      .toLowerCase();


  if (!keyword) {

    renderDrawResults(allDrawResults);

    return;

  }


  const filtered =
    allDrawResults.filter(item => {

      const name =
        (item.member_name || '')
          .toLowerCase();

      const email =
        (item.member_email || '')
          .toLowerCase();

      const prize =
        (item.prize_name || '')
          .toLowerCase();

      return (
        name.includes(keyword) ||
        email.includes(keyword) ||
        prize.includes(keyword)
      );

    });


  renderDrawResults(filtered);

}


function renderDrawResults(items) {

  const list =
    document.getElementById('drawResultList');


  if (!items || items.length === 0) {

    list.innerHTML =
      '<div class="small">找不到中獎紀錄</div>';

    return;

  }


  list.innerHTML = '';


  items.forEach(item => {

    const box =
      document.createElement('div');

    box.style.background = '#f3f3f3';
    box.style.borderRadius = '12px';
    box.style.padding = '14px';
    box.style.marginBottom = '12px';


    const time =
      item.drawn_at
        ? new Date(item.drawn_at).toLocaleString()
        : '';


    const redeemedTime =
      item.redeemed_at
        ? new Date(item.redeemed_at).toLocaleString()
        : '';


    const statusHtml = !item.requires_redemption
  ? `
      <div style="margin-top:10px;font-weight:bold;">
        ✅ 無需領取
      </div>
    `
  : item.redeemed
    ? `
        <div style="margin-top:10px;font-weight:bold;">
          ✅ 已領取
        </div>
        <div class="small">
          領取時間：${escapeHtmlAdmin(redeemedTime)}
        </div>
      `
    : `
        <div style="margin-top:10px;font-weight:bold;color:#e63946;">
          ⏳ 待領取
        </div>
        <button
          class="button"
          style="margin-top:10px;"
          onclick="markRedeemed('${item.result_id}')"
        >
          ✅ 標記已領取
        </button>
      `;


    box.innerHTML = `

      <div style="font-weight:bold;font-size:18px;">
        🎁 ${escapeHtmlAdmin(item.prize_name)}
      </div>

      <div class="small" style="margin-top:7px;line-height:1.8;">
        👤 ${escapeHtmlAdmin(item.member_name || '未設定暱稱')}<br>
        📧 ${escapeHtmlAdmin(item.member_email || '無會員 Email')}<br>
        🎪 ${escapeHtmlAdmin(item.campaign_title)}<br>
        🧧 第 ${item.slot_number} 格<br>
        🕐 ${escapeHtmlAdmin(time)}
      </div>

      ${statusHtml}

    `;


    list.appendChild(box);

  });

}


async function markRedeemed(resultId) {

  const ok =
    confirm('確定已經把這個獎品交給客人了嗎？');

  if (!ok) return;


  const { error } =
    await db.rpc(
      'admin_mark_redeemed',
      {
        p_result_id: resultId
      }
    );


  if (error) {

    console.error(error);

    alert(
      '標記失敗：' + error.message
    );

    return;

  }


  alert('✅ 已標記為領取');

  await loadDrawResults();

}
