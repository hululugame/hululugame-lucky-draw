  <script>

    const SUPABASE_URL =
      'https://rhssnydqgdlkaxwrwwlp.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_KN1SvNhpJtxfTg-Lz_D16w_6L41j_wW';

    const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth: {
      storageKey: 'hululugame-member-auth',
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);

function getDeviceId() {

  let deviceId =
    localStorage.getItem('hululugame-device-id');

  if (!deviceId) {

    deviceId =
      crypto.randomUUID();

    localStorage.setItem(
      'hululugame-device-id',
      deviceId
    );

  }

  return deviceId;

}


    function showLogin() {

      document.getElementById('loginBox')
        .classList.remove('hidden');

      document.getElementById('registerBox')
        .classList.add('hidden');

      document.getElementById('loginTab')
        .classList.add('active');

      document.getElementById('registerTab')
        .classList.remove('active');

      document.getElementById('authStatus')
        .innerText = '';

    }


    function showRegister() {

      document.getElementById('registerBox')
        .classList.remove('hidden');

      document.getElementById('loginBox')
        .classList.add('hidden');

      document.getElementById('registerTab')
        .classList.add('active');

      document.getElementById('loginTab')
        .classList.remove('active');

      document.getElementById('authStatus')
        .innerText = '';

    }


    async function login() {

      const email =
        document.getElementById('loginEmail')
          .value.trim();

      const password =
        document.getElementById('loginPassword')
          .value;

      const status =
        document.getElementById('authStatus');


      if (!email || !password) {
        status.innerText = '請輸入 Email 和密碼';
        return;
      }


      status.innerText = '登入中...';


      const { data, error } =
        await db.auth.signInWithPassword({
          email,
          password
        });


      if (error) {

        console.error(error);

        status.innerText =
          '登入失敗，請確認帳號密碼';

        return;

      }


      status.innerText = '';

      await showMember(data.user);

    }
    
    async function forgotPassword() {
  const email =
    document.getElementById('loginEmail').value.trim();

  if (!email) {
    alert('請先輸入註冊時使用的 Email');
    return;
  }

  const { error } =
    await db.auth.resetPasswordForEmail(email, {
      redirectTo:
        'https://draw.hululugame.com/member.html'
    });

  if (error) {
    console.error(error);
    alert('重設密碼信寄送失敗，請稍後再試');
    return;
  }

  alert(
    '重設密碼信已寄出，請到 Email 信箱查看。'
  );
}

async function updatePassword() {

  const newPassword =
    document.getElementById('newPassword').value;

  const confirmPassword =
    document.getElementById('confirmNewPassword').value;

  if (!newPassword || !confirmPassword) {
    alert('請完整輸入兩次新密碼');
    return;
  }

  if (newPassword.length < 6) {
    alert('新密碼至少需要 6 碼');
    return;
  }

  if (newPassword !== confirmPassword) {
    alert('兩次輸入的密碼不一致');
    return;
  }

  const { error } =
    await db.auth.updateUser({
      password: newPassword
    });

  if (error) {
    console.error(error);
    alert('密碼更新失敗，請重新操作忘記密碼');
    return;
  }

  alert('✅ 密碼設定成功，請使用新密碼重新登入');

  await db.auth.signOut();

  window.location.href =
    'https://draw.hululugame.com/member.html';
}


    async function register() {

      const name =
        document.getElementById('registerName')
          .value.trim();

      const email =
        document.getElementById('registerEmail')
          .value.trim();

      const password =
        document.getElementById('registerPassword')
          .value;

      const status =
        document.getElementById('authStatus');


      if (!name || !email || !password) {

        status.innerText =
          '請完整填寫暱稱、Email、密碼';

        return;

      }


      if (password.length < 6) {

        status.innerText =
          '密碼至少要 6 碼';

        return;

      }


      status.innerText =
        '建立會員中...';


      const { data, error } =
        await db.auth.signUp({
          email,
          password
        });


      if (error) {

        console.error(error);

        status.innerText =
          '註冊失敗：' + error.message;

        return;

      }


      if (data.session) {

        await db.rpc(
          'create_my_profile',
          {
            p_display_name: name
          }
        );

        status.innerText = '';

        await showMember(data.user);

      } else {

        status.innerText =
          '✅ 註冊成功，請先到 Email 完成驗證，再回來登入。';

      }

    }


    async function showMember(user) {

      document.getElementById('authCard')
        .classList.add('hidden');

      document.getElementById('memberCard')
        .classList.remove('hidden');

      document.getElementById('memberInfo')
        .innerText =
          '登入 Email：' + (user?.email || '');

      await loadProfile();

      await loadDrawStatus();
      
      await loadMyPrizes();

    }


    async function loadProfile() {

      const { data, error } =
        await db.rpc('get_my_profile');


      if (error) {

        console.error(error);

        return;

      }


      if (data && data.length > 0) {

        document.getElementById('displayName')
          .value =
            data[0].display_name || '';

      }

    }


    async function saveProfile() {

      const name =
        document.getElementById('displayName')
          .value.trim();

      const status =
        document.getElementById('memberStatus');


      if (!name) {

        status.innerText =
          '暱稱不能空白';

        return;

      }


      const { error } =
        await db.rpc(
          'create_my_profile',
          {
            p_display_name: name
          }
        );


      if (error) {

        console.error(error);

        status.innerText =
          '儲存失敗';

        return;

      }


      status.innerText =
        '✅ 暱稱已儲存';

    }


    async function loadDrawStatus() {

      const { data, error } =
        await db.rpc('get_my_draw_status');


      if (error) {

        console.error(error);

        return;

      }


      if (!data || data.length === 0) {

        document.getElementById('campaignName')
          .innerText =
            '目前沒有活動';

        document.getElementById('remainingDraws')
          .innerText = '0';

        return;

      }


      const item = data[0];


      document.getElementById('campaignName')
        .innerText =
          item.campaign_title || '目前活動';


      document.getElementById('remainingDraws')
        .innerText =
          item.remaining_draws ?? 0;


      document.getElementById('drawDetail')
        .innerText =
          `總共 ${item.draws_available ?? 0} 抽，
           已使用 ${item.draws_used ?? 0} 抽`;

    }

async function redeemCode() {

  const code =
    document.getElementById('redeemCodeInput')
      .value.trim();

  const status =
    document.getElementById('redeemMemberStatus');


  if (!code) {

    status.innerText =
      '請輸入兌換碼';

    return;

  }


  status.innerText =
    '兌換中...';
    
    const deviceId =
  getDeviceId();


  const { data, error } =
  await db.rpc(
    'redeem_draw_code',
    {
      p_code: code,
      p_device_id: deviceId
    }
  );


  if (error) {

    console.error(error);

    status.innerText =
      '❌ ' + error.message;

    return;

  }


  if (!data || data.length === 0) {

    status.innerText =
      '兌換失敗';

    return;

  }


  const result =
    data[0];


  status.innerText =
    `✅ 兌換成功！獲得 ${result.draws_received} 抽`;


  document.getElementById('redeemCodeInput')
    .value = '';


  await loadDrawStatus();

}

let allMyPrizes = [];
let showAllMyPrizes = false;

async function loadMyPrizes() {

  const list =
    document.getElementById('myPrizeList');

  if (!list) return;

  list.innerHTML = '載入中...';

  const { data, error } =
    await db.rpc('get_my_draw_results');

  if (error) {
    console.error(error);
    list.innerHTML = '讀取失敗：' + error.message;
    return;
  }

  allMyPrizes =
    (data || []).filter(
      item => item.requires_redemption
    );

  renderMyPrizes();

}


function renderMyPrizes() {

  const list =
    document.getElementById('myPrizeList');

  if (!list) return;

  if (allMyPrizes.length === 0) {
    list.innerHTML = '目前還沒有中獎品';
    return;
  }

  list.innerHTML = '';

  const prizesToShow =
    showAllMyPrizes
      ? allMyPrizes
      : allMyPrizes.slice(0, 3);


  prizesToShow.forEach(item => {

    const box =
      document.createElement('div');

    box.style.background = '#f3f3f3';
    box.style.borderRadius = '12px';
    box.style.padding = '14px';
    box.style.marginBottom = '12px';

    const drawnTime =
      item.drawn_at
        ? new Date(item.drawn_at).toLocaleString()
        : '';

    const redeemedTime =
      item.redeemed_at
        ? new Date(item.redeemed_at).toLocaleString()
        : '';

    let statusHtml = '';

    if (item.redeemed) {

      statusHtml = `
        <div style="margin-top:8px;font-weight:bold;">
          ✅ 已領取
        </div>

        <div class="small">
          領取時間：${redeemedTime}
        </div>
      `;

    } else {

      statusHtml = `
        <div style="margin-top:8px;font-weight:bold;color:#e63946;">
          ⏳ 待領取
        </div>
      `;

    }


    box.innerHTML = `
      <div style="font-weight:bold;font-size:17px;">
        🎁 ${item.prize_name}
      </div>

      <div class="small" style="margin-top:7px;line-height:1.8;">
        🎪 ${item.campaign_title}<br>
        🧧 第 ${item.slot_number} 格<br>
        🕐 ${drawnTime}
      </div>

      ${statusHtml}
    `;

    list.appendChild(box);

  });


  if (allMyPrizes.length > 3) {

    const toggleButton =
      document.createElement('button');

    toggleButton.className = 'button secondary';

    toggleButton.innerText =
      showAllMyPrizes
        ? '收起獎品'
        : `查看全部獎品（${allMyPrizes.length}）`;

    toggleButton.onclick = () => {

      showAllMyPrizes =
        !showAllMyPrizes;

      renderMyPrizes();

    };

    list.appendChild(toggleButton);

  }

}

    function goDraw() {

      window.location.href = './index.html';

    }


    async function logout() {

      await db.auth.signOut();

      document.getElementById('memberCard')
        .classList.add('hidden');

      document.getElementById('authCard')
        .classList.remove('hidden');

      showLogin();

    }


    async function checkSession() {

      const { data } =
        await db.auth.getSession();

      if (data.session) {
        await showMember(data.session.user);
      }

    }


    checkSession();
    
    db.auth.onAuthStateChange(async (event, session) => {

  if (event === 'PASSWORD_RECOVERY') {

    const authCard =
      document.getElementById('authCard');

    const memberCard =
      document.getElementById('memberCard');

    const loginBox =
      document.getElementById('loginBox');

    const registerBox =
      document.getElementById('registerBox');

    const resetBox =
      document.getElementById('resetPasswordBox');


    if (authCard) {
      authCard.classList.remove('hidden');
    }

    if (memberCard) {
      memberCard.classList.add('hidden');
    }

    if (loginBox) {
      loginBox.classList.add('hidden');
    }

    if (registerBox) {
      registerBox.classList.add('hidden');
    }

    if (resetBox) {
      resetBox.classList.remove('hidden');
    }

  }

});

  </script>
