<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hululugame 會員中心</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans TC", sans-serif;
      background: #fff8e7;
      color: #222;
    }

    .header {
      background: #e63946;
      color: white;
      text-align: center;
      padding: 22px 16px;
      border-bottom: 6px solid #ffc300;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
    }

    .container {
      max-width: 520px;
      margin: auto;
      padding: 16px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
    }

    .input {
      width: 100%;
      height: 48px;
      border: 2px solid #ddd;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    .button {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 12px;
      background: #e63946;
      color: white;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .button.secondary {
      background: #444;
    }

    .button.light {
      background: #f3f3f3;
      color: #222;
    }

    .hidden {
      display: none;
    }

    .status {
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
      line-height: 1.6;
    }

    .draw-box {
      background: #fff3c4;
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      margin: 15px 0;
    }

    .draw-number {
      font-size: 38px;
      font-weight: bold;
      color: #e63946;
      margin: 8px 0;
    }

    .small {
      color: #777;
      font-size: 14px;
      line-height: 1.6;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-weight: bold;
      background: #eee;
    }

    .tab.active {
      background: #e63946;
      color: white;
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>👤 hululugame 會員中心</h1>
  </header>

  <main class="container">

    <section id="authCard" class="card">

      <div class="tabs">
        <button id="loginTab" class="tab active" onclick="showLogin()">
          登入
        </button>

        <button id="registerTab" class="tab" onclick="showRegister()">
          註冊
        </button>
      </div>


      <div id="loginBox">

        <input
          id="loginEmail"
          class="input"
          type="email"
          placeholder="Email"
        >

        <input
          id="loginPassword"
          class="input"
          type="password"
          placeholder="密碼"
        >

        <button class="button" onclick="login()">
          登入會員
        </button>
        
        <button
  type="button"
  id="forgotPasswordBtn"
class="forgot-password-btn"
onclick="forgotPassword()"
>
  忘記密碼？
</button>

      </div>


      <div id="registerBox" class="hidden">

        <input
          id="registerName"
          class="input"
          placeholder="暱稱，例如：小明"
        >

        <input
          id="registerEmail"
          class="input"
          type="email"
          placeholder="Email"
        >

        <input
          id="registerPassword"
          class="input"
          type="password"
          placeholder="密碼，至少 6 碼"
        >

        <button class="button" onclick="register()">
          建立會員
        </button>

        <p class="small">
          註冊完成後不會自動獲得抽獎次數。
          抽數需由店家依消費或活動贈送。
        </p>

      </div>

      <div id="authStatus" class="status"></div>

    </section>


    <section id="memberCard" class="card hidden">

      <h2>我的會員</h2>

      <div id="memberInfo" class="small"></div>

      <div class="draw-box">

        <div id="campaignName">
          目前活動
        </div>

        <div id="remainingDraws" class="draw-number">
          0
        </div>

        <div>
          剩餘抽獎次數
        </div>

        <div id="drawDetail" class="small" style="margin-top:8px;"></div>

      </div>
      
<div style="margin-top:18px;">

  <h3>🎟️ 兌換活動碼</h3>

  <input
    id="redeemCodeInput"
    class="input"
    placeholder="輸入兌換碼，例如：HULU888"
  >

  <button class="button" onclick="redeemCode()">
    兌換抽獎次數
  </button>

  <div id="redeemMemberStatus" class="status"></div>

</div>

<div style="margin-top:22px;">
  <h3>🎁 我的獎品</h3>
  <div id="myPrizeList" class="small">
    載入中...
  </div>
</div>

      <input
        id="displayName"
        class="input"
        placeholder="會員暱稱"
      >

      <button class="button light" onclick="saveProfile()">
        儲存暱稱
      </button>


      <button class="button" onclick="goDraw()">
        🎪 前往抽抽樂
      </button>


      <button class="button secondary" onclick="logout()">
        登出
      </button>

      <div id="memberStatus" class="status"></div>

    </section>

  </main>


  <script>

    const SUPABASE_URL =
      'https://rhssnydqgdlkaxwrwwlp.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_KN1SvNhpJtxfTg-Lz_D16w_6L41j_wW';

    const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth: {
      storageKey: 'hululugame-member-auth',
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);

function getDeviceId() {

  let deviceId =
    localStorage.getItem('hululugame-device-id');

  if (!deviceId) {

    deviceId =
      crypto.randomUUID();

    localStorage.setItem(
      'hululugame-device-id',
      deviceId
    );

  }

  return deviceId;

}


    function showLogin() {

      document.getElementById('loginBox')
        .classList.remove('hidden');

      document.getElementById('registerBox')
        .classList.add('hidden');

      document.getElementById('loginTab')
        .classList.add('active');

      document.getElementById('registerTab')
        .classList.remove('active');

      document.getElementById('authStatus')
        .innerText = '';

    }


    function showRegister() {

      document.getElementById('registerBox')
        .classList.remove('hidden');

      document.getElementById('loginBox')
        .classList.add('hidden');

      document.getElementById('registerTab')
        .classList.add('active');

      document.getElementById('loginTab')
        .classList.remove('active');

      document.getElementById('authStatus')
        .innerText = '';

    }


    async function login() {

      const email =
        document.getElementById('loginEmail')
          .value.trim();

      const password =
        document.getElementById('loginPassword')
          .value;

      const status =
        document.getElementById('authStatus');


      if (!email || !password) {
        status.innerText = '請輸入 Email 和密碼';
        return;
      }


      status.innerText = '登入中...';


      const { data, error } =
        await db.auth.signInWithPassword({
          email,
          password
        });


      if (error) {

        console.error(error);

        status.innerText =
          '登入失敗，請確認帳號密碼';

        return;

      }


      status.innerText = '';

      await showMember(data.user);

    }
    
    async function forgotPassword() {
  const email =
    document.getElementById('loginEmail').value.trim();

  if (!email) {
    alert('請先輸入註冊時使用的 Email');
    return;
  }

  const { error } =
    await db.auth.resetPasswordForEmail(email, {
      redirectTo:
        'https://draw.hululugame.com/member.html'
    });

  if (error) {
    console.error(error);
    alert('重設密碼信寄送失敗，請稍後再試');
    return;
  }

  alert(
    '重設密碼信已寄出，請到 Email 信箱查看。'
  );
}


    async function register() {

      const name =
        document.getElementById('registerName')
          .value.trim();

      const email =
        document.getElementById('registerEmail')
          .value.trim();

      const password =
        document.getElementById('registerPassword')
          .value;

      const status =
        document.getElementById('authStatus');


      if (!name || !email || !password) {

        status.innerText =
          '請完整填寫暱稱、Email、密碼';

        return;

      }


      if (password.length < 6) {

        status.innerText =
          '密碼至少要 6 碼';

        return;

      }


      status.innerText =
        '建立會員中...';


      const { data, error } =
        await db.auth.signUp({
          email,
          password
        });


      if (error) {

        console.error(error);

        status.innerText =
          '註冊失敗：' + error.message;

        return;

      }


      if (data.session) {

        await db.rpc(
          'create_my_profile',
          {
            p_display_name: name
          }
        );

        status.innerText = '';

        await showMember(data.user);

      } else {

        status.innerText =
          '✅ 註冊成功，請先到 Email 完成驗證，再回來登入。';

      }

    }


    async function showMember(user) {

      document.getElementById('authCard')
        .classList.add('hidden');

      document.getElementById('memberCard')
        .classList.remove('hidden');

      document.getElementById('memberInfo')
        .innerText =
          '登入 Email：' + (user?.email || '');

      await loadProfile();

      await loadDrawStatus();
      
      await loadMyPrizes();

    }


    async function loadProfile() {

      const { data, error } =
        await db.rpc('get_my_profile');


      if (error) {

        console.error(error);

        return;

      }


      if (data && data.length > 0) {

        document.getElementById('displayName')
          .value =
            data[0].display_name || '';

      }

    }


    async function saveProfile() {

      const name =
        document.getElementById('displayName')
          .value.trim();

      const status =
        document.getElementById('memberStatus');


      if (!name) {

        status.innerText =
          '暱稱不能空白';

        return;

      }


      const { error } =
        await db.rpc(
          'create_my_profile',
          {
            p_display_name: name
          }
        );


      if (error) {

        console.error(error);

        status.innerText =
          '儲存失敗';

        return;

      }


      status.innerText =
        '✅ 暱稱已儲存';

    }


    async function loadDrawStatus() {

      const { data, error } =
        await db.rpc('get_my_draw_status');


      if (error) {

        console.error(error);

        return;

      }


      if (!data || data.length === 0) {

        document.getElementById('campaignName')
          .innerText =
            '目前沒有活動';

        document.getElementById('remainingDraws')
          .innerText = '0';

        return;

      }


      const item = data[0];


      document.getElementById('campaignName')
        .innerText =
          item.campaign_title || '目前活動';


      document.getElementById('remainingDraws')
        .innerText =
          item.remaining_draws ?? 0;


      document.getElementById('drawDetail')
        .innerText =
          `總共 ${item.draws_available ?? 0} 抽，
           已使用 ${item.draws_used ?? 0} 抽`;

    }

async function redeemCode() {

  const code =
    document.getElementById('redeemCodeInput')
      .value.trim();

  const status =
    document.getElementById('redeemMemberStatus');


  if (!code) {

    status.innerText =
      '請輸入兌換碼';

    return;

  }


  status.innerText =
    '兌換中...';
    
    const deviceId =
  getDeviceId();


  const { data, error } =
  await db.rpc(
    'redeem_draw_code',
    {
      p_code: code,
      p_device_id: deviceId
    }
  );


  if (error) {

    console.error(error);

    status.innerText =
      '❌ ' + error.message;

    return;

  }


  if (!data || data.length === 0) {

    status.innerText =
      '兌換失敗';

    return;

  }


  const result =
    data[0];


  status.innerText =
    `✅ 兌換成功！獲得 ${result.draws_received} 抽`;


  document.getElementById('redeemCodeInput')
    .value = '';


  await loadDrawStatus();

}

let allMyPrizes = [];
let showAllMyPrizes = false;

async function loadMyPrizes() {

  const list =
    document.getElementById('myPrizeList');

  if (!list) return;

  list.innerHTML = '載入中...';

  const { data, error } =
    await db.rpc('get_my_draw_results');

  if (error) {
    console.error(error);
    list.innerHTML = '讀取失敗：' + error.message;
    return;
  }

  allMyPrizes =
    (data || []).filter(
      item => item.requires_redemption
    );

  renderMyPrizes();

}


function renderMyPrizes() {

  const list =
    document.getElementById('myPrizeList');

  if (!list) return;

  if (allMyPrizes.length === 0) {
    list.innerHTML = '目前還沒有中獎品';
    return;
  }

  list.innerHTML = '';

  const prizesToShow =
    showAllMyPrizes
      ? allMyPrizes
      : allMyPrizes.slice(0, 3);


  prizesToShow.forEach(item => {

    const box =
      document.createElement('div');

    box.style.background = '#f3f3f3';
    box.style.borderRadius = '12px';
    box.style.padding = '14px';
    box.style.marginBottom = '12px';

    const drawnTime =
      item.drawn_at
        ? new Date(item.drawn_at).toLocaleString()
        : '';

    const redeemedTime =
      item.redeemed_at
        ? new Date(item.redeemed_at).toLocaleString()
        : '';

    let statusHtml = '';

    if (item.redeemed) {

      statusHtml = `
        <div style="margin-top:8px;font-weight:bold;">
          ✅ 已領取
        </div>

        <div class="small">
          領取時間：${redeemedTime}
        </div>
      `;

    } else {

      statusHtml = `
        <div style="margin-top:8px;font-weight:bold;color:#e63946;">
          ⏳ 待領取
        </div>
      `;

    }


    box.innerHTML = `
      <div style="font-weight:bold;font-size:17px;">
        🎁 ${item.prize_name}
      </div>

      <div class="small" style="margin-top:7px;line-height:1.8;">
        🎪 ${item.campaign_title}<br>
        🧧 第 ${item.slot_number} 格<br>
        🕐 ${drawnTime}
      </div>

      ${statusHtml}
    `;

    list.appendChild(box);

  });


  if (allMyPrizes.length > 3) {

    const toggleButton =
      document.createElement('button');

    toggleButton.className = 'button secondary';

    toggleButton.innerText =
      showAllMyPrizes
        ? '收起獎品'
        : `查看全部獎品（${allMyPrizes.length}）`;

    toggleButton.onclick = () => {

      showAllMyPrizes =
        !showAllMyPrizes;

      renderMyPrizes();

    };

    list.appendChild(toggleButton);

  }

}

    function goDraw() {

      window.location.href = './index.html';

    }


    async function logout() {

      await db.auth.signOut();

      document.getElementById('memberCard')
        .classList.add('hidden');

      document.getElementById('authCard')
        .classList.remove('hidden');

      showLogin();

    }


    async function checkSession() {

      const { data } =
        await db.auth.getSession();

      if (data.session) {
        await showMember(data.session.user);
      }

    }


    checkSession();

  </script>

</body>
</html>
