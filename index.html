<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>hululugame 抽抽樂</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans TC", sans-serif;
      background: #fff8e7;
      color: #292929;
    }

    .header {
      background: #e63946;
      color: white;
      text-align: center;
      padding: 24px 16px;
      border-bottom: 6px solid #ffc300;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 8px 0 0;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding: 16px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    .campaign-title {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .remaining {
      text-align: center;
      font-size: 18px;
      color: #e63946;
      font-weight: bold;
    }

    .prizes h2 {
      margin-top: 0;
    }

    .prize-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px dashed #ddd;
      padding: 10px 0;
    }

    .input {
      width: 100%;
      height: 48px;
      border: 2px solid #ddd;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 17px;
      margin-bottom: 10px;
    }

    .button {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 12px;
      background: #e63946;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .draw-info {
      text-align: center;
      margin-top: 12px;
      font-weight: bold;
    }

    .board-title {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .slot {
      aspect-ratio: 1;
      border: 3px solid #ffc300;
      background: #e63946;
      color: white;
      border-radius: 13px;
      font-size: 17px;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #a51d28;
    }

    .slot span {
      font-size: 24px;
    }

    .slot.drawn {
      background: #ddd;
      color: #777;
      border-color: #bbb;
      box-shadow: none;
    }

    .notice {
      text-align: center;
      color: #777;
      line-height: 1.7;
      font-size: 14px;
    }

    .result-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.72);
      align-items: center;
      justify-content: center;
      padding: 25px;
      z-index: 999;
    }

    .result-box {
      background: white;
      width: 100%;
      max-width: 400px;
      border-radius: 22px;
      padding: 28px 20px;
      text-align: center;
    }

    .result-prize {
      font-size: 30px;
      font-weight: bold;
      margin: 22px 0;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #777;
    }
    
    .hidden {
  display: none !important;
}

:root {
  --brand-red: #b91c1c;
  --brand-red-2: #ef4444;
  --brand-gold: #f6c453;
  --brand-cream: #fff8eb;
  --brand-cream-2: #fffdf7;
  --brand-text: #2b2118;
  --brand-muted: #7c6f64;
  --card-border: rgba(185, 28, 28, 0.08);
  --shadow-soft: 0 12px 30px rgba(82, 54, 31, 0.10);
  --shadow-hover: 0 16px 38px rgba(82, 54, 31, 0.16);
}

body {
  background:
    radial-gradient(circle at 20% 0%, rgba(246,196,83,.16), transparent 30%),
    linear-gradient(180deg, #fffaf0 0%, #fff7e8 55%, #fffdf7 100%);
  color: var(--brand-text);
}

.card,
section,
.panel {
  border-radius: 22px;
}

.card {
  background: rgba(255,255,255,.92);
  border: 1px solid var(--card-border);
  box-shadow: var(--shadow-soft);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

button,
.btn,
input[type="button"],
input[type="submit"] {
  border-radius: 16px;
  transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
}

button:active,
.btn:active,
input[type="button"]:active,
input[type="submit"]:active {
  transform: scale(.98);
}

h1, h2, h3 {
  letter-spacing: .01em;
}

small,
.muted,
.subtext {
  color: var(--brand-muted);
}

.header {
  background: linear-gradient(135deg, #7f1d1d, #dc2626 55%, #f59e0b);
  padding: 34px 16px 30px;
  border-bottom: 0;
  box-shadow: 0 10px 28px rgba(127, 29, 29, .25);
}

.header h1 {
  font-size: 30px;
  text-shadow: 0 2px 8px rgba(0,0,0,.18);
}

.header p {
  opacity: .92;
  font-size: 15px;
}

.header {
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(circle at 85% 20%, rgba(255,196,0,.35), transparent 28%),
    radial-gradient(circle at 15% 80%, rgba(255,255,255,.12), transparent 25%),
    linear-gradient(135deg, #7f1d1d 0%, #b91c1c 38%, #dc2626 68%, #f59e0b 100%);
  padding: 34px 18px 30px;
  border-bottom: none;
  box-shadow: 0 12px 30px rgba(127,29,29,.28);
}

.header::before,
.header::after {
  content: "";
  position: absolute;
  width: 140px;
  height: 140px;
  border: 1px solid rgba(255,255,255,.10);
  border-radius: 50%;
}

.header::before {
  top: -70px;
  left: -50px;
}

.header::after {
  right: -55px;
  bottom: -85px;
}

.header-inner {
  position: relative;
  z-index: 1;
  max-width: 650px;
  margin: 0 auto;
}

.brand-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

.brand-icon {
  font-size: 34px;
  line-height: 1;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,.22));
}

.brand-text {
  text-align: left;
}

.brand-en {
  font-size: 30px;
  line-height: 1;
  font-weight: 900;
  letter-spacing: -.03em;
  color: #fff;
  text-shadow: 0 3px 10px rgba(0,0,0,.22);
}

.brand-zh {
  margin-top: 6px;
  font-size: 14px;
  font-weight: 700;
  color: rgba(255,255,255,.88);
}

.header-subtitle {
  margin-top: 18px;
  text-align: center;
  font-size: 15px;
  color: rgba(255,255,255,.92);
}

.header-badge {
  width: max-content;
  max-width: 100%;
  margin: 14px auto 0;
  padding: 7px 14px;
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 999px;
  background: rgba(255,255,255,.12);
  color: #fff8dc;
  font-size: 13px;
  font-weight: 700;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
  </style>
</head>

<body>

<header class="header">
  <div class="header-inner">
    <div class="brand-row">
      <div class="brand-icon">🎪</div>

      <div class="brand-text">
        <div class="brand-en">hululugame</div>
        <div class="brand-zh">呼嚕嚕手遊代儲｜抽抽樂</div>
      </div>
    </div>

    <div class="header-subtitle">
      消費享抽獎機會・好禮等你帶回家
    </div>

    <div class="header-badge">
      ✨ 每期限定活動
    </div>
  </div>
</header>

<main class="container">

  <section class="card">
    <div id="campaignTitle" class="campaign-title">
      載入活動中...
    </div>

    <div id="remaining" class="remaining">
      載入中...
    </div>
    
    <div
  id="campaignRules"
  class="small"
  style="margin-top:10px;line-height:1.8;"
></div>

  </section>


  <section class="card prizes">
    <h2>🎁 本期獎品</h2>

    <div id="prizeList">
      <div class="loading">載入獎品中...</div>
    </div>
  </section>


<section class="card">

  <div id="memberArea">

    <div id="guestView">

      <div style="font-weight:bold;font-size:18px;margin-bottom:10px;">
        👤 會員登入後即可抽獎
      </div>

      <button class="button" onclick="goMemberLogin()">
        登入 / 註冊會員
      </button>

    </div>


    <div id="memberView" class="hidden">

      <div style="font-weight:bold;font-size:18px;">
        👤 <span id="memberName">會員</span>
      </div>

      <div id="memberEmail"
           style="font-size:14px;color:#777;margin-top:5px;">
      </div>

      <div id="drawInfo" class="draw-info">
        載入抽獎次數中...
      </div>

      <button
        class="button"
        style="margin-top:12px;background:#444;"
        onclick="goMemberCenter()"
      >
        會員中心 / 兌換活動碼
      </button>

    </div>

  </div>

</section>


  <section class="card">

    <div class="board-title">
      🧧 選一格抽抽樂
    </div>

    <div id="board" class="board">
      <div class="loading">載入格子中...</div>
    </div>

  </section>


  <section class="card notice">
    消費滿指定金額即可獲得抽獎機會。<br>
    每一格只能被抽取一次。<br>
    實際獎品與領獎方式以活動公告為準。
  </section>

</main>


<div id="resultOverlay" class="result-overlay">
  <div class="result-box">

    <div style="font-size:50px;">🎉</div>

    <h2>你的抽獎結果</h2>

    <div id="resultPrize" class="result-prize"></div>

    <div id="resultRemaining"
         style="margin-bottom:20px;font-weight:bold;">
    </div>

    <button class="button" onclick="closeResult()">
      收下獎品
    </button>

  </div>
</div>


<script>

  // =============================================
  // 把你剛剛複製的兩個資料貼在這裡
  // =============================================

  const SUPABASE_URL =
    'https://rhssnydqgdlkaxwrwwlp.supabase.co';

  const SUPABASE_KEY =
    'sb_publishable_KN1SvNhpJtxfTg-Lz_D16w_6L41j_wW';


  const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth: {
      storageKey: 'hululugame-member-auth',
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);


  let currentUser = null;
let remainingDraws = 0;


  async function loadCampaign() {

    const { data, error } =
      await db.rpc('get_public_campaign');

    if (error) {
      console.error(error);
      document.getElementById('campaignTitle').innerText =
        '活動讀取失敗';
      return;
    }

    if (!data) {
  document.getElementById('campaignTitle').innerText =
    '🎪 目前沒有進行中的抽抽樂';

  document.getElementById('remaining').innerText =
    '新一期活動準備中，敬請期待！';

  return;
}

    document.getElementById('campaignTitle').innerText =
      '🎉 ' + data.title;

    document.getElementById('remaining').innerText =
      `剩餘 ${data.remaining_slots} / ${data.total_slots} 格`;

const startText =
  data.start_at
    ? new Date(data.start_at).toLocaleString(
        'zh-TW',
        { hour12: false }
      )
    : '未設定';

const endText =
  data.end_at
    ? new Date(data.end_at).toLocaleString(
        'zh-TW',
        { hour12: false }
      )
    : '未設定';

let ruleText =
  `活動期間：${startText} ～ ${endText}\n` +
  `每消費 ${data.spend_per_draw} 元可獲得 1 抽\n` +
  `本期未使用抽數於活動結束後失效，不累積至下一期。`;

if (data.end_when_jackpot_drawn) {
  ruleText +=
    '\n⭐ 頭獎抽出後，本期活動將提前結束';
}

document.getElementById('campaignRules').innerText =
  ruleText;
  
  }


  async function loadPrizes() {

    const { data, error } =
      await db.rpc('get_public_prizes');

    if (error) {
      console.error(error);
      return;
    }

    const list =
      document.getElementById('prizeList');

    list.innerHTML = '';

if (!data || data.length === 0) {
  list.innerHTML =
    '<div class="small">目前沒有進行中的活動獎品</div>';
  return;
}

data.forEach(prize => {

      const row =
        document.createElement('div');

      row.className = 'prize-row';

      row.innerHTML = `
        <span>🎁 ${escapeHtml(prize.prize_name)}</span>
        <strong>
          剩 ${prize.remaining_quantity}
          / ${prize.total_quantity}
        </strong>
      `;

      list.appendChild(row);

    });

  }


  async function loadSlots() {

    const { data, error } =
      await db.rpc('get_public_slots');

    if (error) {
      console.error(error);
      return;
    }

    const board =
      document.getElementById('board');

    board.innerHTML = '';

if (!data || data.length === 0) {
  board.innerHTML =
    '<div class="small">目前沒有可抽的格子</div>';
  return;
}

data.forEach(item => {

      const slot =
        document.createElement('div');

      slot.className =
        item.is_drawn
          ? 'slot drawn'
          : 'slot';

      if (item.is_drawn) {

        slot.innerHTML = `
          <span>✓</span>
          ${String(item.slot_number).padStart(2,'0')}
          已抽
        `;

      } else {

        slot.innerHTML = `
          <span>🧧</span>
          ${String(item.slot_number).padStart(2,'0')}
        `;

        slot.onclick = () =>
          drawSlot(item.slot_number);

      }

      board.appendChild(slot);

    });

  }


  async function checkMemberSession() {

  const { data } =
    await db.auth.getSession();

  if (!data.session) {

    currentUser = null;
    remainingDraws = 0;

    document.getElementById('guestView')
      .classList.remove('hidden');

    document.getElementById('memberView')
      .classList.add('hidden');

    return;

  }


  currentUser =
    data.session.user;


  document.getElementById('guestView')
    .classList.add('hidden');

  document.getElementById('memberView')
    .classList.remove('hidden');


  document.getElementById('memberEmail')
    .innerText =
      currentUser.email || '';


  const { data: profile } =
    await db.rpc('get_my_profile');


  if (profile && profile.length > 0) {

    document.getElementById('memberName')
      .innerText =
        profile[0].display_name ||
        '會員';

  }


  await loadMemberDrawStatus();

}


async function loadMemberDrawStatus() {

  const { data, error } =
    await db.rpc('get_my_draw_status');


  if (error) {

    console.error(error);

    document.getElementById('drawInfo')
      .innerText =
        '抽獎次數讀取失敗';

    return;

  }


  if (!data || data.length === 0) {

    remainingDraws = 0;

    document.getElementById('drawInfo')
      .innerText =
        '🎟️ 目前剩餘 0 次抽獎機會';

    return;

  }


  remainingDraws =
    data[0].remaining_draws ?? 0;


  document.getElementById('drawInfo')
    .innerHTML =
      `🎟️ 目前剩餘
       <strong>${remainingDraws} 次</strong>
       抽獎機會`;

}


function goMemberLogin() {

  window.location.href =
    './member.html';

}


function goMemberCenter() {

  window.location.href =
    './member.html';

}


  async function drawSlot(slotNumber) {

  if (!currentUser) {

    alert('請先登入會員');

    goMemberLogin();

    return;

  }


  if (remainingDraws <= 0) {

    alert('你的抽獎次數已用完');

    return;

  }


  const ok =
    confirm(
      `確定要抽第 ${slotNumber} 格嗎？`
    );

  if (!ok) return;


  const { data, error } =
    await db.rpc(
      'draw_slot_member',
      {
        p_slot_number:
          slotNumber
      }
    );


  if (error) {

    console.error(error);

    alert(
      error.message ||
      '抽獎失敗，請重新整理後再試'
    );

    await refreshAll();

    await loadMemberDrawStatus();

    return;

  }


  if (!data || data.length === 0) {
    return;
  }


  const result =
    data[0];


  remainingDraws =
    result.remaining_draws;


  document.getElementById(
    'resultPrize'
  ).innerText =
    '🎁 ' + result.prize_name;


  document.getElementById(
    'resultRemaining'
  ).innerText =
    `剩餘抽獎次數：${remainingDraws} 次`;


  document.getElementById(
    'resultOverlay'
  ).style.display =
    'flex';


  document.getElementById(
    'drawInfo'
  ).innerHTML =
    `🎟️ 目前剩餘
     <strong>${remainingDraws} 次</strong>
     抽獎機會`;


  await refreshAll();

}


  function closeResult() {

    document.getElementById(
      'resultOverlay'
    ).style.display = 'none';

  }


  async function refreshAll() {

    await Promise.all([
      loadCampaign(),
      loadPrizes(),
      loadSlots()
    ]);

  }


  function escapeHtml(text) {

    const div =
      document.createElement('div');

    div.textContent =
      text ?? '';

    return div.innerHTML;

  }


  refreshAll();
  
checkMemberSession();

  // 每 15 秒更新一次
  // 這樣其他客人抽過的格子會自動刷新
  setInterval(
    refreshAll,
    15000
  );

</script>

</body>
</html>
